name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy React frontend
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collaboardation-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: collaboardation-client
        run: npm ci

      - name: Build frontend
        working-directory: collaboardation-client
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: collaboardation-frontend-deploy

      - name: Upload frontend to S3
        run: |
          aws s3 sync collaboardation-client/dist/ \
            s3://${{ vars.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"