services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: collaboardation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  backend:
    build: ./app

    ports:
      - "3000:3000"

    environment:
      DB_HOST: db
      DB_NAME: collaboardation
      DB_USER: postgres
      DB_PASS: postgres
      JWT_SECRET: mysecret

    depends_on:
      - db